# Test-only additions to the application's own properties (Spring Boot reads config/ next to,
# and on top of, the classpath root - the main application.properties stays in effect).

# V8 grants the published schema to public_api_reader, which onepiece-infrastructure creates
# before this service starts. A test database is new each time: create the role first. No
# comma in the statement - this property is a comma-separated list.
spring.flyway.init-sqls=DO $$BEGIN CREATE ROLE public_api_reader NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END$$
