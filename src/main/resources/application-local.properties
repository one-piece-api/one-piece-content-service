# Runs outside the cluster (e.g. from IntelliJ, for debugging): Keycloak and
# content-postgresql still run in the kind cluster, reached via `kubectl port-forward`
# rather than cluster-internal DNS. Values below are local-only placeholders, safe to
# hardcode, never real secrets - same pattern as one-piece-user-service's own file.

# Avoids clashing with Keycloak's port-forward (8080) and user-service's own local run
# (8081, see one-piece-user-service/application-local.properties).
server.port=8082

# kubectl port-forward svc/keycloak-http -n auth 8080:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/onepiece/protocol/openid-connect/certs

# kubectl port-forward svc/one-piece-content-postgresql -n app 5434:5432
# (5434: 5432 is a possible native/local Postgres, 5433 is already used by
# one-piece-user-service's own port-forward of app-postgresql.)
spring.datasource.url=jdbc:postgresql://localhost:5434/content_service
spring.datasource.password=content-service-db-change-me-locally
