# This service runs as a pod inside the kind cluster: Keycloak and the shared Postgres
# instance are reached via cluster-internal Service DNS.

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-http.auth.svc.cluster.local:8080/realms/onepiece/protocol/openid-connect/certs

# content_service database in the shared PostgreSQL instance (onepiece-infrastructure,
# ADR-0016), reached via cluster-internal Service DNS. Password arrives as an env var
# injected by the Helm chart from the one-piece-content-service-db-credentials Secret,
# same pattern as user-service's own datasource wiring.
spring.datasource.url=jdbc:postgresql://one-piece-postgresql.data.svc.cluster.local:5432/content_service
spring.datasource.password=${CONTENT_POSTGRESQL_PASSWORD}
