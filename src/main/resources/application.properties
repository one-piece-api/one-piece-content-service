spring.application.name=content-service

# "local" (this service running outside the cluster, e.g. from IntelliJ for debugging) is
# the default so a plain IntelliJ run needs no extra setup - same convention as
# one-piece-user-service. The Helm chart overrides this to "dev" for the pod running inside
# the kind cluster.
spring.profiles.active=local

# Matches the "/api/content/" upstream path oauth2-proxy routes to this service unchanged
# (see onepiece-infrastructure/oauth2-proxy/values-oauth2-proxy.yaml) so the proxied path
# and this service's own routes line up with no rewriting.
server.servlet.context-path=/api/content

# Kubernetes liveness/readiness probe groups, exposed only as /api/content/actuator/health/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Same realm, same token, same issuer one-piece-user-service already validates - no new
# Keycloak client (docs/implementation-plan-content.md §2). jwk-set-uri differs per profile
# (how *this process* reaches Keycloak to fetch signing keys) - see
# application-dev/local.properties.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/onepiece

# This service's own database in the shared PostgreSQL instance (ADR-0016 in
# onepiece-infrastructure - one database + owner role per service, not shared with
# user-service's). Database/username are fixed by how onepiece-infrastructure provisions
# it; host and password differ per profile - see application-dev/local.properties.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=content_service
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
