spring.application.name=content-service

# "local" (this service running outside the cluster, e.g. from IntelliJ for debugging) is
# the default so a plain IntelliJ run needs no extra setup - same convention as
# one-piece-user-service. The Helm chart overrides this to "dev" for the pod running inside
# the kind cluster.
spring.profiles.active=local

# Matches the "/api/content/" upstream path oauth2-proxy routes to this service unchanged
# (see onepiece-infrastructure/oauth2-proxy/values-oauth2-proxy.yaml) so the proxied path
# and this service's own routes line up with no rewriting.
server.servlet.context-path=/api/content

# Kubernetes liveness/readiness probe groups, exposed only as /api/content/actuator/health/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# OpenAPI spec (/api/content/v3/api-docs) and Swagger UI (/api/content/swagger-ui.html),
# both behind login like every other endpoint (see SecuredEndpoint). Keys ordered so the
# committed openapi/openapi.yaml (OpenApiSpecTest) only changes when the API does. See
# docs/adr/0001-openapi-contract-and-bruno-collection.md.
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json
# Shows x-required-permission (and any other x- extension) in each operation's detail -
# Swagger UI hides vendor extensions by default.
springdoc.swagger-ui.show-extensions=true

# Same realm, same token, same issuer one-piece-user-service already validates - no new
# Keycloak client. jwk-set-uri differs per profile
# (how *this process* reaches Keycloak to fetch signing keys) - see
# application-dev/local.properties.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/onepiece

# This service's own database in the shared PostgreSQL instance (ADR-0016 in
# onepiece-infrastructure - one database + owner role per service, not shared with
# user-service's). Database/username are fixed by how onepiece-infrastructure provisions
# it; host and password differ per profile - see application-dev/local.properties.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=content_service
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# The translations of the versions on a page are loaded in one query per batch, instead of
# one per version.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Paginated lists (page/size/sort query parameters): the page size when none is asked for,
# and the cap applied to whatever is asked for.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# The dashboard: how many of the caller's latest actions "My latest activity" shows.
content.dashboard.activity-size=10

# The rules of an entity about its data: how many fruits a refused retirement of a type
# names (the count is always the whole).
content.rules.blocking-preview-size=5

# The images of each entity (implementation plan of the Devil Fruit, D6): the canvas every
# upload is normalized to (also the least size accepted), how far from its ratio an upload
# may be, the upload's limits and the least share of fully transparent pixels. The base of
# the image URLs answered to clients: this service as the gateway exposes it.
content.images.base-url=/api/content
# Every image is stored as lossy WebP with an exact alpha channel (implementation plan WebP,
# W-D2): quality 0-100; method 0 (fastest) - 6 (smallest: 2 % smaller than 4 at 10-40
# times the time).
content.images.webp.quality=90
content.images.webp.method=4
# The uploads Spring accepts at all: twice the largest profile file, plus the JSON part of
# the same request. Up to here a file too large for its profile is refused by the profile
# (422 with its numbers); beyond, Spring cuts it off (413 CONTENT_TOO_LARGE).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
content.images.profiles.devil-fruit.width=320
content.images.profiles.devil-fruit.height=400
content.images.profiles.devil-fruit.ratio-tolerance=0.1
content.images.profiles.devil-fruit.max-size=5MB
content.images.profiles.devil-fruit.max-pixels=25000000
content.images.profiles.devil-fruit.min-transparent-percent=5
# A volume cover (implementation plan of the story structure, S6; WebP plan, W5): portrait at
# the ratio of the real covers (0.628-0.636, measured on One Piece Wiki), normalized to
# 420 x 665 (12:19); a full-bleed image, so no transparency is asked, and a larger file is
# required than the canvas (the cover is only ever scaled down).
content.images.profiles.volume.width=420
content.images.profiles.volume.height=665
content.images.profiles.volume.min-width=504
content.images.profiles.volume.min-height=800
content.images.profiles.volume.ratio-tolerance=0.1
content.images.profiles.volume.max-size=5MB
content.images.profiles.volume.max-pixels=25000000
content.images.profiles.volume.min-transparent-percent=0
# A bounty poster (implementation plan of the Bounty, D4): the whole poster, as a cover; no transparency.
content.images.profiles.bounty.width=420
content.images.profiles.bounty.height=600
content.images.profiles.bounty.min-width=560
content.images.profiles.bounty.min-height=800
content.images.profiles.bounty.ratio-tolerance=0.1
content.images.profiles.bounty.max-size=5MB
content.images.profiles.bounty.max-pixels=25000000
content.images.profiles.bounty.min-transparent-percent=0
# An affiliation image (implementation plan of the Affiliation, D5; user flow revision 15): the group's flag, 4:3, no transparency required.
content.images.profiles.affiliation.width=400
content.images.profiles.affiliation.height=300
content.images.profiles.affiliation.min-width=512
content.images.profiles.affiliation.min-height=384
content.images.profiles.affiliation.ratio-tolerance=0.1
content.images.profiles.affiliation.max-size=5MB
content.images.profiles.affiliation.max-pixels=25000000
content.images.profiles.affiliation.min-transparent-percent=0

# A species picture (implementation plan of the Species, D5): a portrait, no transparency required.
content.images.profiles.species.width=320
content.images.profiles.species.height=400
content.images.profiles.species.min-width=400
content.images.profiles.species.min-height=500
content.images.profiles.species.ratio-tolerance=0.1
content.images.profiles.species.max-size=5MB
content.images.profiles.species.max-pixels=25000000
content.images.profiles.species.min-transparent-percent=0

# A character portrait (implementation plan of the Character, D7): a portrait, no transparency required.
content.images.profiles.character.width=320
content.images.profiles.character.height=400
content.images.profiles.character.min-width=400
content.images.profiles.character.min-height=500
content.images.profiles.character.ratio-tolerance=0.1
content.images.profiles.character.max-size=5MB
content.images.profiles.character.max-pixels=25000000
content.images.profiles.character.min-transparent-percent=0
