components:
  responses:
    ClientError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: "Client error - a problem detail, except a 401/403 rejected by\
        \ the security filter chain before reaching the application, which has no\
        \ body"
    ServerError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: Unexpected server error
  schemas:
    ActivityResponse:
      type: object
      properties:
        action:
          type: string
        contentId:
          type: string
          format: uuid
        entityType:
          type: string
          enum:
          - DEVIL_FRUIT_TYPE
          - DEVIL_FRUIT
          - SAGA
          - ARC
        label:
          type: string
        occurredAt:
          type: string
          format: date-time
        title:
          $ref: "#/components/schemas/ContentTitleResponse"
        versionNumber:
          type: integer
          format: int32
    ArcNamesResponse:
      type: object
      properties:
        names:
          type: object
          additionalProperties:
            type: string
        number:
          type: integer
          format: int32
        saga:
          $ref: "#/components/schemas/NumberedReferenceResponse"
    ArcRequest:
      type: object
      properties:
        number:
          type: integer
          format: int32
          minimum: 0
        saga:
          type: string
          format: uuid
          description: The content id of its saga
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTranslationRequest"
    ArcResponse:
      type: object
      properties:
        number:
          type: integer
          format: int32
        saga:
          $ref: "#/components/schemas/NumberedReferenceResponse"
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTranslationResponse"
    BlockedActionResponse:
      type: object
      properties:
        action:
          type: string
          enum:
          - EDIT
          - DELETE
          - SUBMIT
          - PULL_BACK
          - CLAIM
          - RELEASE
          - APPROVE
          - REJECT
          - RETURN_TO_DRAFT
          - PUBLISH
          - ARCHIVE
