openapi: 3.1.0
info:
  title: content-service
  version: v1
servers:
- url: /api/content
security:
- keycloak: []
paths:
  /arcs:
    get:
      operationId: arcList
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - REJECTED
          - READY_TO_PUBLISH
          - PUBLISHED
          - ARCHIVED
          - RETIRED
          - SUPERSEDED
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: author
        required: false
        schema:
          type: string
      - in: query
        name: updatedWithinDays
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: The content id of a saga
        in: query
        name: saga
        required: false
        schema:
          type: string
          format: uuid
          description: The content id of a saga
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseContentSummaryResponseArcNamesResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Arcs
      x-required-permission: content:read
    post:
      operationId: arcCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArcRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
          description: Created
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Arcs
      x-required-permission: content:write
  /arcs/authors:
