components:
  responses:
    ClientError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: "Client error - a problem detail, except a 401/403 rejected by\
        \ the security filter chain before reaching the application, which has no\
        \ body"
    ServerError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: Unexpected server error
  schemas:
    ActivityResponse:
      type: object
      properties:
        action:
          type: string
        contentId:
          type: string
          format: uuid
        entityType:
          type: string
          enum:
          - DEVIL_FRUIT_TYPE
          - DEVIL_FRUIT
          - SAGA
          - ARC
          - VOLUME
          - CHAPTER
          - EPISODE
          - BOUNTY
        label:
          type: string
        occurredAt:
          type: string
          format: date-time
        title:
          $ref: "#/components/schemas/ContentTitleResponse"
        versionNumber:
          type: integer
          format: int32
    ArcNamesResponse:
      type: object
      properties:
        names:
          type: object
          additionalProperties:
            type: string
        number:
          type: integer
          format: int32
        saga:
          $ref: "#/components/schemas/NumberedReferenceResponse"
    ArcRequest:
      type: object
      properties:
        number:
          type: integer
          format: int32
          minimum: 0
        saga:
          type: string
          format: uuid
          description: The content id of its saga
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTranslationRequest"
    ArcResponse:
      type: object
      properties:
        number:
          type: integer
          format: int32
        saga:
          $ref: "#/components/schemas/NumberedReferenceResponse"
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTranslationResponse"
    BlockedActionResponse:
      type: object
      properties:
        action:
          type: string
          enum:
          - EDIT
          - DELETE
          - SUBMIT
          - PULL_BACK
          - CLAIM
          - RELEASE
          - APPROVE
          - REJECT
          - RETURN_TO_DRAFT
          - PUBLISH
          - ARCHIVE
          - RECOVER
          - RETIRE
          - RESTORE
          - OPEN_NEW_VERSION
        detail:
          type: object
          additionalProperties: {}
        reason:
          type: string
          enum:
          - TYPE_NOT_ONLINE
          - ONLINE_FRUITS_LINKED
          - SUBCATEGORY_NOT_ONLINE
          - SUBCATEGORY_IN_USE
          - RELATED_NOT_ONLINE
          - ONLINE_ITEMS_LINKED
          - FIRST_APPEARANCE_MISSING
          - PREVIOUS_ALREADY_REPLACED
          - BOUNTY_CHAIN_CYCLE
    BountyNamesResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        condition:
          type: string
          enum:
          - DEAD_OR_ALIVE
          - ONLY_ALIVE
        key:
          type: string
        posterName:
          type: string
        validity:
          type: string
          enum:
          - ACTIVE
          - SUPERSEDED
          - INACTIVE
    BountyReferenceResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        key:
          type: string
        posterName:
          type: string
    BountyRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          description: "Berry, as plain digits"
          minimum: 0
        condition:
          type: string
          enum:
          - DEAD_OR_ALIVE
          - ONLY_ALIVE
        firstAppearance:
          $ref: "#/components/schemas/FirstAppearanceRequest"
        inactive:
          type: boolean
        posterName:
          type: string
          maxLength: 100
          minLength: 0
        previous:
          type: string
          format: uuid
          description: The content id of the bounty it replaces
        removeImage:
          type: boolean
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BountyTranslationRequest"
    BountyResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        chain:
          type: array
          items:
            $ref: "#/components/schemas/BountyReferenceResponse"
        condition:
          type: string
          enum:
          - DEAD_OR_ALIVE
          - ONLY_ALIVE
        firstAppearance:
          $ref: "#/components/schemas/FirstAppearanceResponse"
        image:
          $ref: "#/components/schemas/ImageResponse"
        inactive:
          type: boolean
        next:
          $ref: "#/components/schemas/BountyReferenceResponse"
        posterName:
          type: string
        previous:
          $ref: "#/components/schemas/BountyReferenceResponse"
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BountyTranslationResponse"
        validity:
          type: string
          enum:
          - ACTIVE
          - SUPERSEDED
          - INACTIVE
    BountyTranslationRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
          minLength: 0
    BountyTranslationResponse:
      type: object
      properties:
        description:
          type: string
    ChapterNamesResponse:
      type: object
      properties:
        arc:
          $ref: "#/components/schemas/NumberedReferenceResponse"
        names:
          type: object
          additionalProperties:
            type: string
        number:
          type: integer
          format: int32
        volume:
          $ref: "#/components/schemas/NumberedReferenceResponse"
    ChapterRequest:
      type: object
      properties:
        arc:
          type: string
          format: uuid
          description: The content id of its arc
        japaneseTitle:
          type: string
          maxLength: 200
          minLength: 0
        number:
          type: integer
          format: int32
          minimum: 0
        pageCount:
          type: integer
          format: int32
          exclusiveMinimum: 0
        releases:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseRequest"
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTranslationRequest"
        volume:
          type: string
          format: uuid
          description: The content id of its volume; left out for none
    ChapterResponse:
      type: object
      properties:
        arc:
          $ref: "#/components/schemas/NumberedReferenceResponse"
        japaneseTitle:
          type: string
        number:
          type: integer
          format: int32
        pageCount:
          type: integer
          format: int32
        releases:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseResponse"
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StoryTranslationResponse"
        volume:
