openapi: 3.1.0
info:
  title: content-service
  version: v1
servers:
- url: /api/content
security:
- keycloak: []
paths:
  /devil-fruit-types:
    get:
      operationId: devilFruitTypeList
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - REJECTED
          - READY_TO_PUBLISH
          - PUBLISHED
          - ARCHIVED
          - RETIRED
          - SUPERSEDED
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: author
        required: false
        schema:
          type: string
      - in: query
        name: updatedWithinDays
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseContentSummaryResponseDevilFruitTypeNamesResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:read
    post:
      operationId: devilFruitTypeCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevilFruitTypeRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
          description: Created
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:write
  /devil-fruit-types/authors:
    get:
      operationId: devilFruitTypeAuthors
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:read
  /devil-fruit-types/summary:
    get:
      operationId: devilFruitTypeSummary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentListSummaryResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:read
  /devil-fruit-types/{id}:
    get:
      operationId: devilFruitTypeGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:read
  /devil-fruit-types/{id}/versions/{number}:
    get:
      operationId: devilFruitTypeVersion
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: number
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponseDevilFruitTypeResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:read
    put:
      operationId: devilFruitTypeEdit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: number
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevilFruitTypeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponseDevilFruitTypeResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:write
  /devil-fruit-types/{id}/versions/{number}/events:
    get:
      operationId: devilFruitTypeEvents
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: number
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionEventResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Devil Fruit Types
      x-required-permission: content:read
  /languages:
    get:
      operationId: languageList
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
    post:
      operationId: languageCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLanguageRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageResponse"
          description: Created
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
      x-required-permission: languages:manage
  /languages/{code}:
    delete:
      operationId: languageDelete
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
      x-required-permission: languages:manage
components:
  responses:
    ClientError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: "Client error - a problem detail, except a 401/403 rejected by\
        \ the security filter chain before reaching the application, which has no\
        \ body"
    ServerError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: Unexpected server error
  schemas:
    ContentListSummaryResponse:
      type: object
      properties:
        mine:
          type: integer
          format: int64
        statuses:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - IN_REVIEW
            - REJECTED
            - READY_TO_PUBLISH
            - PUBLISHED
            - ARCHIVED
            - RETIRED
            - SUPERSEDED
        total:
          type: integer
          format: int64
    ContentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        onlineVersionNumber:
          type: integer
          format: int32
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionSummaryResponse"
    ContentSummaryResponseDevilFruitTypeNamesResponse:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - EDIT
            - DELETE
            - SUBMIT
            - PULL_BACK
            - CLAIM
            - RELEASE
            - APPROVE
            - REJECT
            - RETURN_TO_DRAFT
            - PUBLISH
            - ARCHIVE
            - RECOVER
            - RETIRE
            - RESTORE
            - OPEN_NEW_VERSION
        author:
          $ref: "#/components/schemas/UserResponse"
        body:
          $ref: "#/components/schemas/DevilFruitTypeNamesResponse"
        id:
          type: string
          format: uuid
        onlineVersionNumber:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - REJECTED
          - READY_TO_PUBLISH
          - PUBLISHED
          - ARCHIVED
          - RETIRED
          - SUPERSEDED
        updatedAt:
          type: string
          format: date-time
        versionNumber:
          type: integer
          format: int32
    CreateLanguageRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    DevilFruitTypeNamesResponse:
      type: object
      properties:
        names:
          type: object
          additionalProperties:
            type: string
        romaji:
          type: string
    DevilFruitTypeRequest:
      type: object
      properties:
        romaji:
          type: string
          maxLength: 100
          minLength: 0
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DevilFruitTypeTranslationRequest"
    DevilFruitTypeResponse:
      type: object
      properties:
        romaji:
          type: string
        translations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DevilFruitTypeTranslationResponse"
    DevilFruitTypeTranslationRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
          minLength: 0
        name:
          type: string
          maxLength: 100
          minLength: 0
    DevilFruitTypeTranslationResponse:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
    FieldViolation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    LanguageResponse:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    PageResponseContentSummaryResponseDevilFruitTypeNamesResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummaryResponseDevilFruitTypeNamesResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProblemDetail:
      type: object
      description: "RFC 9457 problem detail, plus this API's own properties"
      properties:
        detail:
          type: string
        errorCode:
          type: string
          description: "Stable, machine-readable error code"
        errors:
          type: array
          description: "Per-field failures, present only when errorCode is VALIDATION_FAILED"
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
          format: uri
      required:
      - errorCode
      - status
      - title
      - type
    UserResponse:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
        username:
          type: string
    VersionEventResponse:
      type: object
      properties:
        action:
          type: string
        actor:
          $ref: "#/components/schemas/UserResponse"
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
    VersionResponseDevilFruitTypeResponse:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - EDIT
            - DELETE
            - SUBMIT
            - PULL_BACK
            - CLAIM
            - RELEASE
            - APPROVE
            - REJECT
            - RETURN_TO_DRAFT
            - PUBLISH
            - ARCHIVE
            - RECOVER
            - RETIRE
            - RESTORE
            - OPEN_NEW_VERSION
        author:
          $ref: "#/components/schemas/UserResponse"
        basedOn:
          type: integer
          format: int32
        body:
          $ref: "#/components/schemas/DevilFruitTypeResponse"
        claimant:
          $ref: "#/components/schemas/UserResponse"
        createdAt:
          type: string
          format: date-time
        everPublished:
          type: boolean
        number:
          type: integer
          format: int32
        rejectionReason:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - REJECTED
          - READY_TO_PUBLISH
          - PUBLISHED
          - ARCHIVED
          - RETIRED
          - SUPERSEDED
        updatedAt:
          type: string
          format: date-time
    VersionSummaryResponse:
      type: object
      properties:
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - EDIT
            - DELETE
            - SUBMIT
            - PULL_BACK
            - CLAIM
            - RELEASE
            - APPROVE
            - REJECT
            - RETURN_TO_DRAFT
            - PUBLISH
            - ARCHIVE
            - RECOVER
            - RETIRE
            - RESTORE
            - OPEN_NEW_VERSION
        author:
          $ref: "#/components/schemas/UserResponse"
        basedOn:
          type: integer
          format: int32
        claimant:
          $ref: "#/components/schemas/UserResponse"
        createdAt:
          type: string
          format: date-time
        everPublished:
          type: boolean
        number:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - REJECTED
          - READY_TO_PUBLISH
          - PUBLISHED
          - ARCHIVED
          - RETIRED
          - SUPERSEDED
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    keycloak:
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/onepiece/protocol/openid-connect/auth
          refreshUrl: http://localhost:8080/realms/onepiece/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect sign-in
          tokenUrl: http://localhost:8080/realms/onepiece/protocol/openid-connect/token
      type: oauth2
