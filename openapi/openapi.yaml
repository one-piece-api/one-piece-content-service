openapi: 3.1.0
info:
  title: content-service
  version: v1
servers:
- url: /api/content
security:
- keycloak: []
paths:
  /languages:
    get:
      operationId: languageList
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageResponse"
          description: OK
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
    post:
      operationId: languageCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLanguageRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageResponse"
          description: Created
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
      x-required-permission: languages:manage
  /languages/{code}:
    delete:
      operationId: languageDelete
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"
      tags:
      - Languages
      x-required-permission: languages:manage
components:
  responses:
    ClientError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: "Client error - a problem detail, except a 401/403 rejected by\
        \ the security filter chain before reaching the application, which has no\
        \ body"
    ServerError:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      description: Unexpected server error
  schemas:
    CreateLanguageRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    FieldViolation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    LanguageResponse:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    ProblemDetail:
      type: object
      description: "RFC 9457 problem detail, plus this API's own properties"
      properties:
        detail:
          type: string
        errorCode:
          type: string
          description: "Stable, machine-readable error code"
        errors:
          type: array
          description: "Per-field failures, present only when errorCode is VALIDATION_FAILED"
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
          format: uri
      required:
      - errorCode
      - status
      - title
      - type
  securitySchemes:
    keycloak:
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/onepiece/protocol/openid-connect/auth
          refreshUrl: http://localhost:8080/realms/onepiece/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect sign-in
          tokenUrl: http://localhost:8080/realms/onepiece/protocol/openid-connect/token
      type: oauth2
