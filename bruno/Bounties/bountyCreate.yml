info:
  name: bountyCreate
  type: http
  seq: 2
  tags:
    - Bounties

http:
  method: POST
  url: "{{baseUrl}}/bounties"
  body:
    type: json
    data: |-
      {
        "amount": 0,
        "condition": "DEAD_OR_ALIVE",
        "firstAppearance": {
          "chapter": "",
          "episode": ""
        },
        "inactive": false,
        "posterName": "",
        "previous": "",
        "removeImage": false,
        "translations": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/bounties"
      method: POST
      body:
        type: json
        data: |-
          {
            "amount": 0,
            "condition": "DEAD_OR_ALIVE",
            "firstAppearance": {
              "chapter": "",
              "episode": ""
            },
            "inactive": false,
            "posterName": "",
            "previous": "",
            "removeImage": false,
            "translations": {}
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "onlineVersionNumber": 0,
            "versions": [
              {
                "allowedActions": [
                  "EDIT"
                ],
                "author": {
                  "email": "",
                  "id": "",
                  "username": ""
                },
                "basedOn": 0,
                "claimant": {
                  "email": "",
                  "id": "",
                  "username": ""
                },
                "createdAt": "",
                "everPublished": false,
                "number": 0,
                "overrideActions": [
                  "EDIT"
                ],
                "status": "DRAFT",
                "updatedAt": ""
              }
            ]
          }
  - name: 4XX Response
    description: Client error - a problem detail, except a 401/403 rejected by the security filter chain before reaching the application, which has no body
    request:
      url: "{{baseUrl}}/bounties"
      method: POST
      body:
        type: json
        data: |-
          {
            "amount": 0,
