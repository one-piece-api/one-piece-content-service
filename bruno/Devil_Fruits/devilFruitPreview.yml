http:
  method: GET
  url: "{{baseUrl}}/devil-fruits/:id/versions/:number/preview"
  params:
    - name: id
      value: ""
      type: path
    - name: number
      value: ""
      type: path
    - name: asOfChapter
      value: ""
      type: query
      description: The chapter the reader is at, 1 or more; not with asOfEpisode
      disabled: true
    - name: asOfEpisode
      value: ""
      type: query
      description: The episode the reader is at, 1 or more; not with asOfChapter
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

