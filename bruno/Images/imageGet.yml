info:
  name: imageGet
  type: http
  seq: 1
  tags:
    - Images

http:
  method: GET
  url: "{{baseUrl}}/images/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/images/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: image/png
      body:
        type: text
        data: ""
  - name: 4XX Response
    description: Client error - a problem detail, except a 401/403 rejected by the security filter chain before reaching the application, which has no body
    request:
      url: "{{baseUrl}}/images/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "errorCode": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ],
            "instance": "",
            "status": 0,
            "timestamp": "",
            "title": "",
            "traceId": "",
            "type": ""
          }
  - name: 5XX Response
    description: Unexpected server error
    request:
      url: "{{baseUrl}}/images/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "errorCode": "",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ],
            "instance": "",
            "status": 0,
            "timestamp": "",
            "title": "",
            "traceId": "",
            "type": ""
          }
