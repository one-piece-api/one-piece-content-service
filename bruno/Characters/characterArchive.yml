info:
  name: characterArchive
  type: http
  seq: 12
  tags:
    - Characters

http:
  method: POST
  url: "{{baseUrl}}/characters/:id/versions/:number/archive"
  params:
    - name: id
      value: ""
      type: path
    - name: number
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

