info:
  name: characterLinkable
  type: http
  seq: 4
  tags:
    - Characters

http:
  method: GET
  url: "{{baseUrl}}/characters/linkable"
  params:
    - name: page
      value: "0"
      type: query
      description: 0-based page, 0 when missing
      disabled: true
    - name: size
      value: "1"
      type: query
      description: "Page size: 20 when missing, at most 50"
      disabled: true
    - name: q
      value: ""
      type: query
      description: Text the romaji or a name contains, case-insensitive; 100 characters at most
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/characters/linkable"
      method: GET
      params:
        - name: page
          value: "0"
          type: query
          description: 0-based page, 0 when missing
          disabled: true
        - name: size
          value: "1"
          type: query
          description: "Page size: 20 when missing, at most 50"
          disabled: true
        - name: q
          value: ""
          type: query
          description: Text the romaji or a name contains, case-insensitive; 100 characters at most
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "content": [
              {
                "id": "",
                "names": {},
                "romaji": ""
              }
            ],
            "page": 0,
            "size": 0,
            "totalElements": 0,
